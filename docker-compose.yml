# 로컬에서 컨테이너로 웹 UI(대시보드/이력/예약설정)를 띄울 때 쓰는 설정.
# 사용법: docker compose up -d --build
# 접속 주소: http://localhost:8000
#
# Engage Center 로그인은 사내망/VPN 연결된 PC에서만 되고 컨테이너 안에서는 안 되므로,
# 이 컨테이너는 화면(대시보드)만 담당하고 실제 실행은 로컬 PC에서 띄운 local_runner.py
# 에게 위임한다(TICKET_SYNC_EXEC_MODE=remote). local_runner.py 를 먼저 켜두어야
# "실행" 버튼이나 예약 실행이 동작한다:
#     .venv\Scripts\python.exe local_runner.py
#
# data/ 폴더(로그인 세션 browser_profile, tickets.db)를 그대로 마운트하므로,
# 로컬 PC에서 python main.py 로 미리 로그인해서 만든 세션을 컨테이너와 local_runner.py가
# 같이 공유해서 본다(실행 이력/케이스 목록은 컨테이너가 표시, 실제 실행은 local_runner가 수행).
services:
  ticket-sync:
    build: .
    image: ticket-sync:local
    container_name: ticket-sync
    environment:
      - TICKET_SYNC_EXEC_MODE=remote
      - TICKET_SYNC_LOCAL_RUNNER_URL=http://host.docker.internal:8787
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
