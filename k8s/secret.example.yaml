# 실제 값을 채운 뒤 파일명을 secret.yaml 로 바꿔서 적용하세요(Git 등에 커밋하지 마세요).
#   kubectl apply -f k8s/secret.yaml
#
# Freshdesk 도메인/API Key는 여기 없습니다 — 이제 DB(freshdesk_connections 테이블,
# rqlite로 공유)에 저장되고, 웹 UI의 "Freshdesk Management > 설정" 화면에서 관리합니다.
#
# 세션 만료 알림(NOTIFY_WEBHOOK_URL 등)도 여기 없습니다 — 실제 로그인/동기화는 이 파드가
# 아니라 로컬 PC의 local_runner.py가 하므로, 알림 설정은 이 Secret이 아니라 그 PC의
# .env 파일에 둡니다(k8s/README.md 참고).
apiVersion: v1
kind: Secret
metadata:
  name: ticket-sync-secrets
type: Opaque
stringData:
  # Cloudflare Tunnel(또는 동등한 터널)로 노출한 local_runner.py 를 호출할 때 실을 공유
  # 토큰. local_runner.py 쪽 TICKET_SYNC_RUNNER_TOKEN 과 반드시 같은 값이어야 한다 —
  # 다르면 401로 거부된다.
  TICKET_SYNC_RUNNER_TOKEN: "REPLACE_ME"

  # rqlite HTTP Basic Auth 자격증명. rqlite 실행 시 만든 인증 파일(k8s/README.md 4번 참고)의
  # 값과 같아야 한다.
  TICKET_SYNC_RQLITE_USER: "ticket-sync"
  TICKET_SYNC_RQLITE_PASSWORD: "REPLACE_ME"
